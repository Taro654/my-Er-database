    <!-- 年齢確認ゲート -->
    <div class="age-gate" id="ageGate">

            <p><strong>あなたは18歳以上ですか?</strong></p>
            <div class="age-gate-buttons">
                <button class="age-gate-btn yes" onclick="confirmAge(true)">はい</button>
                <button class="age-gate-btn no" onclick="confirmAge(false)">いいえ</button>
            </div>
        </div>
    </div>

        <div class="menu-item" onclick="switchPage('databasePage'); toggleSideMenu();">📚 データベース</div>
        <div class="menu-item" onclick="switchPage('favoritesPage'); toggleSideMenu();">❤️ お気に入り</div>
        <div class="menu-item" onclick="switchPage('privacyPage'); toggleSideMenu();">🔒 プライバシー</div>
        <div class="menu-item" onclick="switchPage('termsPage'); toggleSideMenu();">📜 利用規約</div>
        <div class="menu-item" onclick="switchPage('disclaimerPage'); toggleSideMenu();">⚠️ 免責事項</div>
    </nav>
    <div class="menu-overlay" id="menuOverlay" onclick="toggleSideMenu()"></div>

    <div id="counter"></div>

        <button class="next-btn" onclick="showNextPerson()">次の人を見る ➡️</button>
    </div>

    <!-- データベースページ -->

            <select id="categorySelect" onchange="filterDatabase()">

        <div id="databaseList" class="database-list"></div>
    </div>

    <!-- お気に入りページ -->
    <div id="favoritesPage" class="page">
        <h2>お気に入り</h2>
        <div id="favoritesList"></div>
    </div>

    <!-- 詳細ページ -->
    <div id="detailPage" class="page">
        <div id="detailContent"></div>
        <button class="back-btn-small" onclick="backToList()">← 一覧に戻る</button>
    </div>

    <!-- ポリシーページ -->
    <div id="privacyPage" class="page policy-content"></div>
    <div id="termsPage" class="page policy-content"></div>
    <div id="disclaimerPage" class="page policy-content"></div>

    <!-- 下部固定メニュー -->
    <div class="fixed-menu">
        <div class="bottom-nav" onclick="switchPage('shufflePage')">
            <div class="bottom-nav-icon">🎲</div>
            <div class="bottom-nav-label">シャッフル</div>
        </div>
        <div class="bottom-nav" onclick="switchPage('databasePage')">
            <div class="bottom-nav-icon">📚</div>
            <div class="bottom-nav-label">データベース</div>
        </div>
        <div class="bottom-nav" onclick="switchPage('favoritesPage')">
            <div class="bottom-nav-icon">❤️</div>
            <div class="bottom-nav-label">お気に入り</div>
        </div>
    </div>

    <!--Javascript-->
    <script>
        // データ読み込み
let people = [];
let policyData = null;
let shuffledPeople = [];
let currentIndex = 0;
let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
let currentFilter = '';
let lastPage = 'shufflePage';
let currentDetailPersonId = null;

// JSONファイルを読み込む
async function loadData() {
    try {
        const [peopleRes, policyRes] = await Promise.all([
            fetch('people.json'),
            fetch('policy.json')
        ]);
        people = await peopleRes.json();
        policyData = await policyRes.json();
        
        shuffledPeople = shuffleArray([...people]);
        initializeApp();
    } catch (error) {
        console.error('データ読み込みエラー:', error);
        people = [];
        policyData = {};
    }
}

function initializeApp() {
    displayPerson(shuffledPeople[0]);
    updateCounter();
    setupDatabase();
    displayPolicy('privacy');
    displayPolicy('terms');
    displayPolicy('disclaimer');
    checkAge();
}

// シャッフル関数
function shuffleArray(array) {
    const newArray = [...array];
    for (let i = newArray.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
    }
    return newArray;
}

// 年齢確認
function checkAge() {
    const ageConfirmed = localStorage.getItem('ageConfirmed');
    if (ageConfirmed === 'true') {
        document.getElementById('ageGate').classList.add('hidden');
    }
}

function confirmAge(isAdult) {
    if (isAdult) {
        localStorage.setItem('ageConfirmed', 'true');
        document.getElementById('ageGate').classList.add('hidden');
    } else {
        alert('申し訳ございません。18歳未満の方はご利用いただけません。');
        window.location.href = 'https://www.google.com';
    }
}

// サイドメニュー
function toggleSideMenu() {
    const menu = document.getElementById('sideMenu');
    const overlay = document.getElementById('menuOverlay');
    menu.classList.toggle('open');
    overlay.classList.toggle('active');
}

// ページ切り替え
function switchPage(pageId) {
    lastPage = document.querySelector('.page.active')?.id || 'shufflePage';
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    
    if (pageId === 'databasePage') {
        filterDatabase();
    } else if (pageId === 'favoritesPage') {
        displayFavorites();
    }
    
    window.scrollTo(0, 0);
}

// お気に入り機能
function toggleFavorite(personId, event) {
    event.stopPropagation();
    const index = favorites.indexOf(personId);
    if (index > -1) {
        favorites.splice(index, 1);
    } else {
        favorites.push(personId);
    }
    localStorage.setItem('favorites', JSON.stringify(favorites));
    
    // UIを更新
    const btn = event.currentTarget;
    if (favorites.includes(personId)) {
        btn.classList.add('favorited');
        btn.textContent = '❤️';
    } else {
        btn.classList.remove('favorited');
        btn.textContent = '🤍';
    }
}

function toggleFavoriteDetail(personId) {
    const index = favorites.indexOf(personId);
    if (index > -1) {
        favorites.splice(index, 1);
    } else {
        favorites.push(personId);
    }
    localStorage.setItem('favorites', JSON.stringify(favorites));
    
    // 詳細ページのボタンを更新
    const btn = document.getElementById('favBtnDetail');
    if (favorites.includes(personId)) {
        btn.classList.add('favorited');
        btn.textContent = '❤️';
    } else {
        btn.classList.remove('favorited');
        btn.textContent = '🤍';
    }
}

function displayFavorites() {
    const container = document.getElementById('favoritesList');
    const favPeople = people.filter(p => favorites.includes(p.id));
    
    if (favPeople.length === 0) {
        container.innerHTML = `
            <div class="empty-favorites">
                <div class="empty-favorites-icon">💔</div>
                <p>お気に入りがまだありません</p>
            </div>
        `;
        return;
    }
    
    container.innerHTML = favPeople.map(person => `
        <div class="database-item" onclick="showDetail('${person.id}')">
            <img src="${person.imageUrl}" alt="${person.name}" class="database-item-image" onerror="this.style.display='none'">
            <div class="database-item-info">
                <div class="database-item-name">${person.name}</div>
                <div class="database-item-category">${person.category}</div>
            </div>
        </div>
    `).join('');
}

// データベース機能
function setupDatabase() {
    const categories = [...new Set(people.map(p => p.category))];
    const select = document.getElementById('categorySelect');
    select.innerHTML = '<option value="">すべてのカテゴリ</option>' + 
        categories.map(c => `<option value="${c}">${c}</option>`).join('');
}

function filterDatabase() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    const category = document.getElementById('categorySelect').value;
    
    const filtered = people.filter(person => {
        const matchesSearch = person.name.toLowerCase().includes(searchTerm) || 
                            person.furigana.toLowerCase().includes(searchTerm);
        const matchesCategory = !category || person.category === category;
        return matchesSearch && matchesCategory;
    });
    
    displayDatabase(filtered);
}

function displayDatabase(peopleList) {
    const container = document.getElementById('databaseList');
    container.innerHTML = peopleList.map(person => `
        <div class="database-item" onclick="showDetail('${person.id}')">
            <img src="${person.imageUrl}" alt="${person.name}" class="database-item-image" loading="lazy" onerror="this.style.display='none'">
            <div class="database-item-info">
                <div class="database-item-name">${person.name}</div>
                <div class="database-item-category">${person.category}</div>
            </div>
        </div>
    `).join('');
}

function filterCategory(category) {
    currentFilter = category;
    if (category === '') {
        shuffledPeople = shuffleArray([...people]);
    } else {
        shuffledPeople = shuffleArray(people.filter(p => p.category === category));
    }
    currentIndex = 0;
    displayPerson(shuffledPeople[0]);
    updateCounter();
}

function displayPolicy(type) {
    if (!policyData || !policyData[type]) return;
    const data = policyData[type];
    const containerId = `${type}Page`;
    let html = `<h2>${data.title}</h2>`;
    data.sections.forEach(section => {
        html += `<h3>${section.heading}</h3><p>${section.content}</p>`;
        if (section.list) { html += `<ul>${section.list.map(item => `<li>${item}</li>`).join('')}</ul>`; }
    });
    const container = document.getElementById(containerId);
    if (container) container.innerHTML = html;
}

function displayPerson(person) {
   // 人物を表示する関数(PC/スマホ出し分け版)
    // データチェック
    if (!person || !person.features) {
        console.warn("表示する人物データが見つかりません:", person);
        return;
    }

    // スマホかどうか判定(画面幅600px以下)
    const isMobile = window.innerWidth <= 600;
    
// PC・スマホ関係なく、最初の1つだけを表示する
const displayFeatures = [person.features[0]];
    const featuresHTML = displayFeatures.map(f => `<li>${f}</li>`).join('');

    const isFavorited = favorites.includes(person.id);
    const imageHTML = person.imageUrl
        ? `<img src="${person.imageUrl}" alt="${person.name}" class="profile-image" loading="lazy"onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
           <div class="profile-image-placeholder" style="display:none;">👤</div>`
        : `<div class="profile-image-placeholder">👤</div>`;

    const displayElement = document.getElementById('personDisplay');
    if (displayElement) {
        displayElement.innerHTML = `
            <div class="person-card" onclick="showDetail('${person.id}')">
                <div class="favorite-btn ${isFavorited ? 'favorited' : ''}" onclick="toggleFavorite('${person.id}', event)">
                    ${isFavorited ? '❤️' : '🤍'}
                </div>
                <h3>${person.name}</h3>
                ${imageHTML}
                <span class="category">${person.category}</span>
                <div class="features">
                    <ul>
                        ${featuresHTML}
                    </ul>
                </div>
            </div>
        `;
    }
}

function updateCounter() {
    const total = shuffledPeople.length;
    const counterEl = document.getElementById('counter');
    if (counterEl) counterEl.textContent = `${currentIndex + 1}人目 / ${total}人`;
}

function showNextPerson() {
    currentIndex++;
    if (currentIndex >= shuffledPeople.length) {
        filterCategory(currentFilter);
        currentIndex = 0;
    }
    displayPerson(shuffledPeople[currentIndex]);
    updateCounter();
}

function loadVideo(containerId, videoUrl) {
    const container = document.getElementById(containerId);
    container.innerHTML = `<iframe class="video-iframe" src="${videoUrl}?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
}

function openPortfolioLink(url) { window.open(url, '_blank'); }

function showDetail(personId) {
    const person = people.find(p => p.id === personId);
    if (!person) return;
    
    currentDetailPersonId = personId;
    const videoContainerId = `video-container-${person.id}`;
    const isFavorited = favorites.includes(person.id);
    const portfolioHTML = (person.portfolioImages || []).map(img => `
        <div class="portfolio-item" onclick="openPortfolioLink('${img.link}')">
            <img src="${img.url}" alt="作品" class="portfolio-image">
            <div class="portfolio-project-name">${img.projectName}</div>
            <div class="portfolio-id">${img.id}</div>
        </div>
    `).join('');

    document.getElementById('detailContent').innerHTML = `
        <div class="detail-header">
            <div class="furigana">${person.furigana}</div>
            <h2>${person.name}</h2>
            <span class="category">${person.category}</span>
            <button class="back-btn-small" onclick="backToList()">← 一覧に戻る</button>
        </div>
        <img src="${person.imageUrlLarge || person.imageUrl}" alt="${person.name}" class="detail-profile-image"loading="lazy">
        <div class="favorite-btn-detail ${isFavorited ? 'favorited' : ''}" id="favBtnDetail" onclick="toggleFavoriteDetail('${person.id}')">
            ${isFavorited ? '❤️' : '🤍'}
        </div>
        <div class="video-section">
            <h3>紹介ビデオ</h3>
            <div class="video-container" id="${videoContainerId}" onclick="loadVideo('${videoContainerId}', '${person.videoUrl}')">
                <img src="${person.videoThumbnail}" alt="ビデオサムネイル" class="video-thumbnail"loading="lazy">
                <div class="video-play-button"></div>
            </div>
            <a href="${person.affiliateLink}" target="_blank" class="cta-button">詳細はこちら</a>
        </div>
        <div class="detail-section"><h3>ポートフォリオ</h3><div class="portfolio-gallery">${portfolioHTML}</div></div>
        <div class="detail-section">
            <h3>基本情報</h3>
            <div class="info-grid">
                <div class="info-item"><label>固有ID</label><div class="value">${person.id}</div></div>
                <div class="info-item"><label>身長</label><div class="value">${person.height} cm</div></div>
                <div class="info-item"><label>血液型</label><div class="value">${person.bloodType}</div></div>
                <div class="info-item"><label>出身地</label><div class="value">${person.birthplace}</div></div>
                <div class="info-item"><label>生年月日</label><div class="value">${person.birthday}</div></div>
                <div class="info-item"><label>デビュー日</label><div class="value">${person.debutDate}</div></div>
            </div>
        </div>
        <div class="detail-section">
            <h3>身体計測データ</h3>
            <div class="info-grid">
                <div class="info-item"><label>バスト</label><div class="value">${person.measurements.b} cm</div></div>
                <div class="info-item"><label>ウエスト</label><div class="value">${person.measurements.w} cm</div></div>
                <div class="info-item"><label>ヒップ</label><div class="value">${person.measurements.h} cm</div></div>
            </div>
        </div>
        <div class="detail-section"><h3>趣味・特技</h3><div class="info-item"><div class="value">${(person.hobbies || []).join('、')}</div></div></div>
        <button class="back-btn-small" onclick="backToList()">← 一覧に戻る</button>
    `;
    
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('detailPage').classList.add('active');
    
    // ★重要:bodyに「詳細表示中」という合図をつける(これでメニューが消えます)
    document.body.classList.add('detail-open');
    
    window.scrollTo(0, 0);
}

let lastScrollY = window.scrollY; // 直前のスクロール位置を保存

// 戻るボタンの処理
function backToList() {
    // 1. 詳細ページを閉じ、bodyの合図を消す
    document.getElementById('detailPage').classList.remove('active');
    document.body.classList.remove('detail-open');

    // 2. 元のページへ戻る
    switchPage(lastPage);
    
    // 3. 画面を一番上にスクロール
    window.scrollTo(0, 0);
}

// --- サイドメニュー・スワイプ閉鎖(改善版) ---
(function() {
    let startX = 0;
    let startY = 0;
    const menu = document.getElementById('sideMenu');
    if (!menu) return;

    menu.addEventListener('touchstart', (e) => {
        startX = e.touches[0].pageX;
        startY = e.touches[0].pageY;
    }, {passive: true});

    menu.addEventListener('touchend', (e) => {
        const endX = e.changedTouches[0].pageX;
        const endY = e.changedTouches[0].pageY;
        const deltaX = endX - startX;
        const deltaY = endY - startY;
        
        // 横方向のスワイプが縦方向より大きく、かつ左スワイプ(deltaX < 0)の場合にメニューを閉じる
        if (Math.abs(deltaX) > Math.abs(deltaY) && deltaX < -60 && menu.classList.contains('open')) {
            toggleSideMenu();
        }
    }, {passive: true});
})();

window.addEventListener('scroll', () => {
    const header = document.querySelector('.site-header');
    const currentScrollY = window.scrollY;

    // ★現在のページが「shufflePage」かつ「active」クラスを持っているか判定
    const isShufflePage = document.getElementById('shufflePage').classList.contains('active');
    if (currentScrollY > lastScrollY && currentScrollY > 1) {
        // 下にスクロール ＆ 1px以上進んだら隠す
        header.classList.add('header-hidden');
    } else {
        // 上にスクロールしたら表示する
        header.classList.remove('header-hidden');
    }

    lastScrollY = currentScrollY; // 現在の位置を保存
}, { passive: true });

// 初期表示
// ボタンのダブルタップによるズームをJavaScriptで阻止
document.addEventListener('touchend', function (event) {
    var now = (new Date()).getTime();
    if (now - lastTouchEnd <= 300) {
        event.preventDefault(); // 300ms以内の連続タップ(ダブルタップ)を無効化
    }
    lastTouchEnd = now;
}, false);
var lastTouchEnd = 0;

// データ読み込み開始
loadData();
    </script>
    <!--Javascript終わり-->
</body>
</html>
