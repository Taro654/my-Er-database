let people = []; // 最初は空っぽにしておく

async function loadPeopleData() {
    
    const splash = document.getElementById('splash-screen');
    /*const startTime = Date.now();*/
    let isDataLoaded = false;

    // 0.5秒待っても読み込みが終わらない場合のみ、スプラッシュを維持（それまでは透明）
    const slowNetworkThreshold = setTimeout(() => {
        if (!isDataLoaded) {
            splash.style.opacity = "1";
            splash.style.visibility = "visible";
        }
    }, 500);

    try {
        const response = await fetch('people.json');
        if (!response.ok) throw new Error('データ読み込み失敗');
        people = await response.json();

        const policyRes = await fetch('policy.json');
        if (policyRes.ok) policyData = await policyRes.json();

        if (people.length > 0) {
            shuffledPeople = shuffleArray([...people]);
            currentIndex = 0;
            updateCounter();
            displayPerson(shuffledPeople[0]); // ★ここで確実にカードを描画
            
            isDataLoaded = true;
            clearTimeout(slowNetworkThreshold);

            const elapsedTime = Date.now() - startTime;

            // 【判定ロジック】
            // 500ms(0.5秒)以上かかった場合は、せっかくなので3秒間ロゴを見せる
            if (elapsedTime > 500) {
                const remainingWait = Math.max(0, 3000 - elapsedTime);
                setTimeout(() => {
                    hideSplashAndScroll();
                }, remainingWait);
            } else {
                // 爆速で読み込めた場合は、スプラッシュをスキップして即表示
                hideSplashAndScroll();
            }
        }
    } catch (error) {
        console.error('読み込みエラー:', error);
        hideSplashAndScroll(); // エラー時も画面を出す
    }
}

// 共通：スプラッシュを消してカードに寄る
function hideSplashAndScroll() {
    const splash = document.getElementById('splash-screen');
    splash.classList.add('splash-hidden');
    
    // スプラッシュが消えるのを待たずに位置調整を開始
    setTimeout(() => {
        scrollToCard();
    }, 100);
}

function scrollToCard() {
    const card = document.querySelector('.person-card');
    if (!card) return;

    // ヘッダーの高さ分を考慮して位置を計算
    const offset = card.getBoundingClientRect().top + window.pageYOffset - 80;
    
    // スムーズにスクロール
    window.scrollTo({
        top: offset,
        behavior: 'smooth'
    });

    // スマホ特有のガタつき対策：少し遅れて微調整
    setTimeout(() => {
        const reOffset = card.getBoundingClientRect().top + window.pageYOffset - 80;
        if (Math.abs(window.scrollY - reOffset) > 10) {
            window.scrollTo({ top: reOffset, behavior: 'smooth' });
        }
    }, 300);
}

    const targetPage = document.getElementById(pageName + 'Page');
    if (targetPage) targetPage.classList.add('active');

    const menuItems = document.querySelectorAll('.menu-item');
    menuItems.forEach(item => item.classList.remove('active'));

    if (pageName === 'shuffle') {
        if (menuItems[1]) menuItems[1].classList.add('active');
        
        // ★スマホの描画サイクルに合わせて実行
        requestAnimationFrame(() => {

        renderDatabase();

    } else if (pageName === 'favorites') {

        card.onclick = () => showDetail(person.id);
        
        // JSONの項目名に合わせて imageUrl を使用
        card.innerHTML = `
            <img src="${person.imageUrl}" alt="${person.name}" class="database-image" loading="lazy"onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
            <div class="database-name">${person.name}</div>
            <div class="database-category">${person.category || '未分類'}</div>
        `;
        grid.appendChild(card);
    });
}

// 2. 検索・フィルタリングの実行関数
function filterDatabase() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    const selectedCategory = document.getElementById('categorySelect').value;

    const filteredPeople = people.filter(person => {
        // 名前、カテゴリー、趣味を検索対象にする
        const nameMatch = person.name.toLowerCase().includes(searchTerm);
        const categoryMatchInText = (person.category || "").toLowerCase().includes(searchTerm);
        const hobbyMatch = person.hobbies && person.hobbies.some(h => h.toLowerCase().includes(searchTerm));
        
        const matchesSearch = nameMatch || categoryMatchInText || hobbyMatch;
        
        // セレクトボックスのカテゴリー一致チェック
        const matchesCategory = (selectedCategory === 'all' || person.category === selectedCategory);
        
        return matchesSearch && matchesCategory;
    });

    renderDatabase(filteredPeople);
}

// 3. お気に入り一覧の描画
function renderFavorites() {
    const grid = document.getElementById('favoritesGrid');
    const noMsg = document.getElementById('noFavoritesMsg');
    if (!grid) return;

    const favPeople = people.filter(p => favorites.includes(p.id));

    if (favPeople.length === 0) {
        grid.innerHTML = '';
        noMsg.style.display = 'block';
    } else {
        noMsg.style.display = 'none';
        grid.innerHTML = favPeople.map(person => `
            <div class="database-card" onclick="showDetail('${person.id}')">
                <img src="${person.imageUrl}" alt="${person.name}" class="database-image"loading="lazy">
                <div class="database-name">${person.name}</div>
                <div class="database-category">${person.category || '未分類'}</div>
            </div>
        `).join('');
    }
}

// --- 以下、既存の便利機能の維持 ---

function toggleFavorite(personId, event) {
    event.stopPropagation();
    const index = favorites.indexOf(personId);
    if (index > -1) { favorites.splice(index, 1); } else { favorites.push(personId); }
    localStorage.setItem('favorites', JSON.stringify(favorites));
    const btn = event.target;
    btn.classList.toggle('favorited');
    btn.textContent = favorites.includes(personId) ? '❤️' : '🤍';
}

function toggleFavoriteDetail(personId) {
    const index = favorites.indexOf(personId);
    if (index > -1) { favorites.splice(index, 1); } else { favorites.push(personId); }
    localStorage.setItem('favorites', JSON.stringify(favorites));
    const btn = document.getElementById('favBtnDetail');
    if (btn) {
        btn.classList.toggle('favorited');
        btn.textContent = favorites.includes(personId) ? '❤️' : '🤍';
    }
}

function toggleFilter() {
    const filterButtons = document.getElementById('filterButtons');
    const toggleIcon = document.getElementById('toggleIcon');
    filterButtons.classList.toggle('collapsed');
    toggleIcon.classList.toggle('collapsed');
}

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function filterCategory(category) {
    currentFilter = category;
    currentIndex = 0;
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    if(event) event.target.classList.add('active');

    if (category === 'all') {
        shuffledPeople = shuffleArray([...people]);
    } else {
        shuffledPeople = shuffleArray(people.filter(p => p.category === category));
    }
    if (shuffledPeople.length > 0) displayPerson(shuffledPeople[0]);
    updateCounter();
}

function displayPolicy(type) {
    if (!policyData || !policyData[type]) return;
    const data = policyData[type];
    const containerId = `${type}Page`;
    let html = `<h2>${data.title}</h2>`;
    data.sections.forEach(section => {
        html += `<h3>${section.heading}</h3><p>${section.content}</p>`;
        if (section.list) { html += `<ul>${section.list.map(item => `<li>${item}</li>`).join('')}</ul>`; }
    });
    const container = document.getElementById(containerId);
    if (container) container.innerHTML = html;
}

function displayPerson(person) {
   // 人物を表示する関数（PC/スマホ出し分け版）
    // データチェック
    if (!person || !person.features) {
        console.warn("表示する人物データが見つかりません:", person);
        return;
    }

    // スマホかどうか判定（画面幅600px以下）
    const isMobile = window.innerWidth <= 600;
    
// PC・スマホ関係なく、最初の1つだけを表示する
const displayFeatures = [person.features[0]];
    const featuresHTML = displayFeatures.map(f => `<li>${f}</li>`).join('');

    const isFavorited = favorites.includes(person.id);
    const imageHTML = person.imageUrl
        ? `<img src="${person.imageUrl}" alt="${person.name}" class="profile-image" loading="lazy"onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
           <div class="profile-image-placeholder" style="display:none;">👤</div>`
        : `<div class="profile-image-placeholder">👤</div>`;

    const displayElement = document.getElementById('personDisplay');
    if (displayElement) {
        displayElement.innerHTML = `
            <div class="person-card" onclick="showDetail('${person.id}')">
                <div class="favorite-btn ${isFavorited ? 'favorited' : ''}" onclick="toggleFavorite('${person.id}', event)">
                    ${isFavorited ? '❤️' : '🤍'}
                </div>
                <h3>${person.name}</h3>
                ${imageHTML}
                <span class="category">${person.category}</span>
                <div class="features">
                    <ul>
                        ${featuresHTML}
                    </ul>
                </div>
            </div>
        `;
    }
}

function updateCounter() {
    const total = shuffledPeople.length;
    const counterEl = document.getElementById('counter');
    if (counterEl) counterEl.textContent = `${currentIndex + 1}人目 / ${total}人`;
}

function showNextPerson() {
    currentIndex++;
    if (currentIndex >= shuffledPeople.length) {
        filterCategory(currentFilter);
        currentIndex = 0;
    }
    displayPerson(shuffledPeople[currentIndex]);
    updateCounter();
}

function loadVideo(containerId, videoUrl) {

}

let lastScrollY = window.scrollY; // 直前のスクロール位置を保存

window.addEventListener('scroll', () => {
    const header = document.querySelector('.site-header');
    const currentScrollY = window.scrollY;

    // ★現在のページが「shufflePage」かつ「active」クラスを持っているか判定
    const isShufflePage = document.getElementById('shufflePage').classList.contains('active');
    if (currentScrollY > lastScrollY && currentScrollY > 1) {
        // 下にスクロール ＆ 1px以上進んだら隠す
        header.classList.add('header-hidden');
    } else {
        // 上にスクロールしたら表示する
        header.classList.remove('header-hidden');
    }

    lastScrollY = currentScrollY; // 現在の位置を保存
}, { passive: true });

        // ボタンのダブルタップによるズームをJavaScriptで阻止
document.addEventListener('touchend', function (event) {
    var now = (new Date()).getTime();
    if (now - lastTouchEnd <= 300) {
        event.preventDefault(); // 300ms以内の連続タップ（ダブルタップ）を無効化
    }
    lastTouchEnd = now;
}, false);
var lastTouchEnd = 0;
